
# Data Paths
dataset_root: "datasets"
background_dir: "datasets/background"
foreground_dir: "datasets/foreground"
metadata_path: "datasets/foreground/metadata.csv"

# Output Parameters
sampling_frequency: 44100
output_duration: 30.0
output_folder: "output/demo_dataset"
frame_size: 2048 # analysis frame size

# Acceleration: "cpu" (default) or "metal" (Apple Silicon)
acceleration: "metal"

# Virtual Calibration - Background
# Step A: Normalize background RMS to this dBFS level
cal_background_norm: -20.0 
# Step B: Declare that the above level corresponds to this SPL (dB)
cal_background_SPL: 50.0  

# Virtual Calibration - Foreground
# Step A: Normalize foreground Peak to this dBFS level
cal_foreground_norm: -1.0
# Step B: Declare that the above level corresponds to this SPL (dB @ 1m)
cal_foreground_SPL: 100.0

# Mixing Targets
# The desired background SPL in the final mix
required_background_SPL: 45.0
# The desired foreground SPL (@ 1m) in the final mix
required_foreground_SPL: 90.0

# Scene Geometry
# Trajectory: Start position [x, y, z]
start_position: [-100.0, 20.0, 1.0]
# Trajectory: End position [x, y, z]
end_position: [200.0, 20.0, 1.0]

velocity: 72.0 # km/h

# Microphone Array
# List of [x, y, z] positions
mic_positions:
  - [0.0, 0.0, 1.8]
  # - [0.2, 0.0, 1.8] # Stereo pair example
